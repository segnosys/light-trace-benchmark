# Workload: Anthropic Claude with prompt caching
#
# Demonstrates the Anthropic Messages API + cache_control. AnthropicBackend
# automatically marks the system prompt (or last user content block) with
# `cache_control: {type: "ephemeral"}` so requests sharing that prefix hit
# the prompt cache after the first request creates it.
#
# Requires ANTHROPIC_API_KEY in env (or pass --api_key).
#
# What it answers:
#   - Per-request TTFT before vs after cache hits
#   - cache_read_input_tokens / cache_creation_input_tokens reported per request
#   - Aggregate "Prompt cache hit rate" line in the summary
#
# Note: same_prompts_in_burst='true' so every batch sends identical prompts,
# making cache hits trivially observable. For realistic shared-prefix tests,
# use prefix_cache_80pct.yaml against an openai-compatible server instead.

provider: anthropic
base_url: https://api.anthropic.com
model_name: claude-3-5-sonnet-20241022

traffic_pattern: burst
concurrency: 8
max_num_burst: 4
burst_interval: 1.0             # space bursts so 5-min cache TTL doesn't matter

dataset_type: synthetic
synthetic_input_length: 2000    # >1024 token min cacheable size for Sonnet
synthetic_output_length: 100
num_examples: 32
same_prompts_in_burst: 'true'   # all 8 in a batch share text -> cache key match

chat: 'true'
stream: 'true'
ignore_eos: 'false'             # Anthropic ignores ignore_eos anyway
max_tokens: 100
