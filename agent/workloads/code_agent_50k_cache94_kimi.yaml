# Workload: ~50K mean input, 500 output, ~94% prefix-cache hit, Kimi-K2.5-MXFP4 tokenizer.
#
# Cache-hit math (geometric mean over a session):
#   Within a session prompt grows: p_1, p_1+d, p_1+2d, ..., p_1+(N-1)d
#   New (uncached) tokens at turn i = d (turn 1 = p_1).
#   ideal_hit = 1 - (p_1 + (N-1)d) / sum(p_1..p_N) = 1 - p_N / (N*(p_1+p_N)/2)
#   With p_1=5000, d=3000, max_prompt=95000 -> N=31 turns, mean=50K, ideal=~93.9%.

workload:
  system_prompt_len:     1000
  initial_prefix_mean:   4000        # first request prompt ~5K (system + initial)
  initial_prefix_median: 3500
  new_tokens_mean:       3000
  new_tokens_median:     2700
  max_prompt_tokens:     95000

  new_session_rate:      0.03
  session_decay_lambda:  0.005
  initial_sessions:      8

  generation_length_mean:   500
  generation_length_median: 500

  initial_qps:      0.5
  max_qps:          5.0
  ramp_duration:    60
  sustain_duration: 300
  max_inflight:     24
  poisson:          true
  poisson_shape:    3

  acc_len:             1.0
  mtp_overhead_factor: 1.0
  mtp_draft_tokens:    3
  tokenizer:           /path/to/Kimi-K2.5-MXFP4
  gpus:                4
  window:              30

  random_seed: 1337
