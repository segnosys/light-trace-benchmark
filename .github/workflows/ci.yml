name: ci

on:
  push:
    branches: [main, fix/**, improve/**, docs/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps + viewer extras
        run: |
          python -m pip install --upgrade pip
          # `viewer` extras so the loader tests don't auto-skip in CI;
          # they exist precisely to catch regressions in scan/load.
          pip install -e ".[dev,viewer]"
          pip install jsonargparse together pyyaml

      - name: Lint (ruff)
        run: ruff check agent/ agentbench/ tests/

      - name: Run tests
        run: pytest tests/ -v

  smoke-build:
    # Verify the wheel still builds cleanly and ships the YAML presets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install --upgrade pip build
          python -m build --wheel

      - name: Verify bundled workload YAMLs in wheel
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -1)
          echo "wheel = $WHEEL"
          # Must ship agent/workloads YAMLs.
          python -m zipfile -l "$WHEEL" | grep -E 'workloads/.*\.yaml' | head -1 || (echo "no agent workloads in wheel"; exit 1)
          echo "wheel layout OK"
