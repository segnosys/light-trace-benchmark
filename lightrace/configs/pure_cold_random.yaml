# Workload: Pure cold / no prefix sharing (matches kernel-decomposition cg+profile run)
#
# Pure random prompts, no cacheable prefix. Mirrors what kimi25-test's
# 01_load_and_profile.sh sustains for the cg+profile trace: bs=24, ctx=64K,
# random inputs. Use this if you want light-trace's user-perceived TPOT
# number to align with a kernel-level breakdown taken on the same shape.
#
# What it answers:
#   - End-to-end TPOT comparable to inter-hipGraphLaunch interval measurement
#   - Sanity check that client-perceived TPS lands near server's TPOT × bs

provider: sglang
traffic_pattern: concurrent
concurrency: 24

dataset_type: synthetic
synthetic_input_length: 64000
synthetic_output_length: 800
num_examples: 120               # 5 rounds at concurrency=24
synthetic_cached_input_length: 0   # explicit: no cached prefix

chat: 'false'
stream: 'true'
ignore_eos: 'true'
max_tokens: 800
